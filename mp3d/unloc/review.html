<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP3D · 2DFP 재검수</title><style>
*{box-sizing:border-box}body{margin:24px auto;padding:0 20px;max-width:1440px;font:16px/1.5 system-ui;color:#18334a;background:#f5f7fa}h1{font-size:25px;margin:0 0 16px}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}select,button{font:inherit;padding:9px 12px;background:white;border:1px solid #bdcbd8;border-radius:7px}#case{max-width:100%;flex:1}#cause{font-size:19px;font-weight:600;padding:14px 16px;background:#fff0ed;border-left:4px solid #e64b43;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #d8e0e7;border-radius:10px;padding:12px;min-width:0}.caption{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:17px}.caption label{font-size:14px;font-weight:400}canvas{width:100%;display:block;aspect-ratio:4/3;cursor:crosshair}small{display:block;color:#51687c;margin-top:8px}.controls{display:flex;align-items:center;gap:10px;margin-top:14px}input[type=range]{flex:1;max-width:700px;accent-color:#efab00}footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}#saved{color:#496174;font-size:14px}a{color:#165e9b}#error{color:#b42318}.legend{font-size:14px;color:#51687c;margin:10px 0}.decision{display:flex;gap:6px;flex-wrap:wrap}.decision button.active{background:#173f65;color:white;border-color:#173f65}#count{font-size:14px;white-space:nowrap}@media(max-width:850px){.grid{grid-template-columns:1fr}body{padding:0 10px;margin:16px auto}#cause{font-size:17px}#case{flex-basis:100%}}
</style></head><body><h1>2DFP 재검수</h1><nav><select id="queue" aria-label="검토 대상"><option value="manual">직접 확인한 잔여 4건</option><option value="automatic">자동 검출 후보 214건</option></select><button id="prev" aria-label="이전 관측">←</button><select id="case" aria-label="관측"></select><button id="next" aria-label="다음 관측">→</button><span id="count"></span></nav><p id="cause"></p><div class="grid"><div class="panel"><div class="caption">RGB · 빨간 구간 확인</div><canvas id="rgb" width="800" height="600" aria-label="검토 구간을 표시한 RGB"></canvas><small>이미지를 클릭하면 해당 열을 2DFP에서 확인합니다.</small></div><div class="panel"><div class="caption">2DFP · 빨간 경계 확인<label><input id="full" type="checkbox">층 전체</label></div><canvas id="map" width="800" height="600" aria-label="카메라 위치와 검토 경계를 표시한 2DFP"></canvas><small>● 파랑: 카메라 · 노랑: 선택한 방향 · 빨강: 검토 경계 · 초록 점: CAD 벽</small></div></div><div class="controls"><label for="ray">선택 RGB 열</label><input id="ray" type="range" min="0" max="39" value="20"><span id="column"></span></div><div class="legend" id="distance"></div><footer><div class="decision"><button data-choice="keep">현재 지도 유지</button><button data-choice="free">개구부 → Free</button><button data-choice="wall">벽 추가·위치 수정</button><button data-choice="exclude">scan 결손 → RGB 제외</button><button data-choice="hold">보류</button></div><button id="download">검토 저장</button><span id="saved"></span></footer><small>후보의 원인은 추정입니다. 선택 내용은 이 브라우저에 저장되며, 데이터는 검토 후 반영합니다.</small><p id="error"></p><script>
const $=id=>document.getElementById(id),rc=$('rgb').getContext('2d'),mc=$('map').getContext('2d');let data=[],rows=[],rec,imgs={},ticket=0;const storage='mp3d-fp-review-v1';let decisions={};try{decisions=JSON.parse(localStorage.getItem(storage)||'{}')}catch{}const key=r=>r.scene+'/'+r.view,finite=p=>Array.isArray(p)&&p.every(Number.isFinite);const load=src=>new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=()=>no(Error('이미지를 읽지 못했습니다: '+src));i.src=src});
function line(c,a,b,color,width=2){c.beginPath();c.strokeStyle=color;c.lineWidth=width;c.moveTo(...a);c.lineTo(...b);c.stroke()}
function dot(c,p,color,r=4){c.beginPath();c.fillStyle=color;c.arc(...p,r,0,Math.PI*2);c.fill()}
function spans(indices){const out=[];for(const j of indices){if(out.length&&j===out[out.length-1][1]+1)out[out.length-1][1]=j;else out.push([j,j])}return out}
function reload(){rows=data.filter(r=>r.manual===($('queue').value==='manual'));$('case').replaceChildren(...rows.map((r,i)=>new Option(`${r.scene} / Q${r.q} / ${r.view}`,i)));show().catch(fail)}
function fail(e){$('error').textContent=String(e)}
async function show(){const r=rows[Number($('case').value)];if(!r)return;const id=++ticket;const [rgb,map]=await Promise.all([load(r.rgb),load(r.map)]);if(id!==ticket)return;rec=r;imgs={rgb,map};$('ray').value=r.rays[Math.floor(r.rays.length/2)];$('cause').textContent=r.cause;$('count').textContent=`${Number($('case').value)+1} / ${rows.length}`;history.replaceState(null,'','#'+encodeURIComponent(key(r)));$('error').textContent='';mark();draw()}
function mark(){if(!rec)return;const d=decisions[key(rec)];document.querySelectorAll('[data-choice]').forEach(b=>b.classList.toggle('active',b.dataset.choice===d));$('saved').textContent=`검토 ${Object.keys(decisions).length}건 저장됨`}
function draw(){if(!rec)return;const r=rec,j=Number($('ray').value),u=8+j*16,[x,y,z,yaw]=r.pose;rc.clearRect(0,0,800,600);rc.drawImage(imgs.rgb,0,0,800,600);for(const [a,b]of spans(r.rays)){const l=a*20,w=(b-a+1)*20;rc.fillStyle='rgba(239,68,68,.12)';rc.fillRect(l,0,w,600);rc.strokeStyle='#ef4444';rc.lineWidth=3;rc.strokeRect(l+1.5,2,Math.max(1,w-3),596)}line(rc,[u*1.25,0],[u*1.25,600],'#ffd22b',2.5);line(rc,[0,300],[800,300],'rgba(255,210,43,.6)',1);
const pts=[[x,z],...r.focus.filter(finite)];let b=r.bounds;if(!$('full').checked){let xs=pts.map(p=>p[0]),zs=pts.map(p=>p[1]);let xmin=Math.min(...xs)-1.3,xmax=Math.max(...xs)+1.3,zmin=Math.min(...zs)-1.3,zmax=Math.max(...zs)+1.3;const w=Math.max(4,xmax-xmin,(zmax-zmin)*4/3),h=w*3/4,cx=(xmin+xmax)/2,cz=(zmin+zmax)/2;b=[cx-w/2,cz-h/2,cx+w/2,cz+h/2]}
const s=Math.min(760/(b[2]-b[0]),550/(b[3]-b[1])),ox=20+(760-(b[2]-b[0])*s)/2,oy=30+(550-(b[3]-b[1])*s)/2,xy=p=>[ox+(p[0]-b[0])*s,oy+(p[1]-b[1])*s];mc.fillStyle='#e6edf4';mc.fillRect(0,0,800,600);mc.save();mc.beginPath();mc.rect(ox,oy,(b[2]-b[0])*s,(b[3]-b[1])*s);mc.clip();mc.fillStyle='black';mc.fillRect(ox,oy,(b[2]-b[0])*s,(b[3]-b[1])*s);const [xmin,zmin,xmax,zmax]=r.bounds;mc.imageSmoothingEnabled=false;mc.drawImage(imgs.map,ox+(xmin-b[0])*s,oy+(zmin-b[1])*s,(xmax-xmin)*s,(zmax-zmin)*s);
for(let k=0;k<40;k++){const p=r.endpoints.gt[k];if(finite(p))line(mc,xy([x,z]),xy(p),'rgba(66,145,192,.14)',1)}for(const [a,c]of spans(r.rays)){const pp=r.focus.filter((p,i)=>r.rays[i]>=a&&r.rays[i]<=c&&finite(p)).map(xy);if(!pp.length)continue;let xx=pp.map(p=>p[0]),zz=pp.map(p=>p[1]);let l=Math.min(...xx)-10,t=Math.min(...zz)-10,w=Math.max(...xx)-l+10,h=Math.max(...zz)-t+10;mc.strokeStyle='#ef4444';mc.lineWidth=3;mc.strokeRect(l,t,w,h)}
for(const k of r.rays){const p=r.endpoints.cad[k];if(finite(p))dot(mc,xy(p),'#23a16c',2.5)}const g=r.endpoints.gt[j],c=r.endpoints.cad[j];if(finite(g)){line(mc,xy([x,z]),xy(g),'#ffbd00',3);dot(mc,xy(g),'#ef4444',5)}if(finite(c)){line(mc,xy([x,z]),xy(c),'rgba(35,161,108,.7)',2);dot(mc,xy(c),'#23a16c',5)}const a=yaw*Math.PI/180,p=xy([x,z]),e=xy([x+.45*Math.cos(a),z+.45*Math.sin(a)]);line(mc,p,e,'#2478ee',5);dot(mc,p,'#2478ee',6);mc.restore();mc.fillStyle='#233d53';mc.font='14px system-ui';mc.fillText('+X →  +Z ↓',20,19);$('column').textContent=`${u}px`;const f=v=>Number.isFinite(v)?v.toFixed(2)+'m':'무효';$('distance').textContent=`선택 열 거리: 2DFP ${f(r.depths.long[j])} · CAD ${f(r.depths.cad[j])} · scan ${f(r.depths.scan[j])}`}
function move(d){if(!rows.length)return;$('case').value=(Number($('case').value)+d+rows.length)%rows.length;show().catch(fail)}
$('queue').onchange=reload;$('case').onchange=()=>show().catch(fail);$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('full').onchange=draw;$('ray').oninput=draw;$('rgb').onclick=e=>{const b=$('rgb').getBoundingClientRect();$('ray').value=Math.max(0,Math.min(39,Math.round(((e.clientX-b.left)/b.width*640-8)/16)));draw()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(!rec)return;decisions[key(rec)]=b.dataset.choice;try{localStorage.setItem(storage,JSON.stringify(decisions));mark()}catch(e){fail('브라우저 저장에 실패했습니다. 검토 저장으로 내려받아주세요.')}});$('download').onclick=()=>{const result={schema:'mp3d_fp_review_v1',decisions:Object.entries(decisions).map(([id,decision])=>({scene:id.split('/')[0],view:id.split('/')[1],decision}))};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='mp3d_fp_review.json';a.click();URL.revokeObjectURL(url)};
(async()=>{data=await(await fetch('review_cases.json')).json();const wanted=decodeURIComponent(location.hash.slice(1));if(wanted){const item=data.find(r=>key(r)===wanted);if(item)$('queue').value=item.manual?'manual':'automatic'}rows=data.filter(r=>r.manual===($('queue').value==='manual'));$('case').replaceChildren(...rows.map((r,i)=>new Option(`${r.scene} / Q${r.q} / ${r.view}`,i)));if(wanted){const i=rows.findIndex(r=>key(r)===wanted);if(i>=0)$('case').value=i}await show()})().catch(fail);
</script></body></html>
